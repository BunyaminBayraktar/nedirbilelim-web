<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nedir Bilelim — Arkadaş Daveti</title>
<meta name="description" content="Nedir Bilelim'de arkadaşınla yarış, birbirinize meydan okuyun.">
<meta property="og:title" content="Nedir Bilelim'de benimle yarış!">
<meta property="og:description" content="Beni arkadaş olarak ekle, birbirimize meydan okuyalım. 🧠">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap');
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
    font-family:'Nunito Sans',sans-serif; color:#1e1b2e;
    background:linear-gradient(135deg,#16213e,#7c3aed);}
  .card{background:#fff; border-radius:24px; padding:32px 24px; width:100%; max-width:420px; text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);}
  .emoji{font-size:52px; line-height:1;}
  h1{font-family:'Fredoka',sans-serif; font-weight:700; font-size:26px; margin:12px 0 8px;
    background:linear-gradient(90deg,#7c3aed,#0ea5e9); -webkit-background-clip:text; background-clip:text; color:transparent;}
  p{color:#4b4763; font-size:15px; line-height:1.6; margin:0 0 20px;}
  .who{font-weight:800; color:#7c3aed;}
  .btn{display:block; text-decoration:none; font-family:'Fredoka',sans-serif; font-weight:600; font-size:17px;
    padding:14px 18px; border-radius:14px; margin-top:12px;}
  .primary{background:linear-gradient(90deg,#7c3aed,#0ea5e9); color:#fff;}
  .secondary{background:#f5f3ff; color:#5b21b6; border:1.5px solid #ddd6fe;}
  .hint{font-size:13px; color:#716d8a; margin-top:20px; line-height:1.5;}
  .code{display:inline-block; background:#f5f3ff; color:#5b21b6; font-weight:800; padding:2px 8px; border-radius:6px;}
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🧠</div>
    <h1>Nedir Bilelim</h1>
    <p id="lead">Arkadaşın seni Nedir Bilelim'de yarışmaya çağırıyor!</p>

    <a class="btn primary" id="openApp" href="#">Uygulamada Aç</a>
    <a class="btn secondary" id="getApp" href="https://play.google.com/store/apps/details?id=com.thejodey.nedirbilelim&amp;referrer=utm_source%3Ddavet%26utm_medium%3Darkadas">Google Play'den İndir</a>

    <p class="hint" id="hint">
      Uygulama yüklü değilse önce indir, sonra bu sayfaya dönüp <b>Uygulamada Aç</b>'a dokun.
    </p>
  </div>

<script>
(function () {
  var PACKAGE = 'com.thejodey.nedirbilelim';
  // referrer: davetle gelen kurulumlar Admin Paneli raporlarında 'davet' kaynağı olarak görünür
  var PLAY_URL = 'https://play.google.com/store/apps/details?id=' + PACKAGE + '&referrer=' + encodeURIComponent('utm_source=davet&utm_medium=arkadas');
  var params = new URLSearchParams(location.search);
  var username = (params.get('u') || '').trim();
  var valid = /^[A-Za-z0-9_.\-çğıöşüÇĞİÖŞÜ]{1,30}$/.test(username);
  var isAndroid = /android/i.test(navigator.userAgent);

  if (!valid) {
    document.getElementById('openApp').href = isAndroid
      ? 'intent://#Intent;scheme=nedirbilelim;package=' + PACKAGE + ';S.browser_fallback_url=' + encodeURIComponent(PLAY_URL) + ';end'
      : 'nedirbilelim://';
    return;
  }

  // Metne kullanıcı adını güvenli şekilde (textContent) yerleştir
  var lead = document.getElementById('lead');
  lead.textContent = '';
  var who = document.createElement('span');
  who.className = 'who';
  who.textContent = username;
  lead.appendChild(who);
  lead.appendChild(document.createTextNode(' seni Nedir Bilelim\'de arkadaş olarak eklemek istiyor. Birbirinize meydan okuyun, kim daha çok biliyor görün! 🏆'));

  var hint = document.getElementById('hint');
  hint.appendChild(document.createElement('br'));
  hint.appendChild(document.createTextNode('Uygulamada arkadaş eklerken şu kullanıcı adını da arayabilirsin: '));
  var code = document.createElement('span');
  code.className = 'code';
  code.textContent = username;
  hint.appendChild(code);

  var path = 'add-friend/' + encodeURIComponent(username);
  // Android: yüklüyse uygulamayı açar, değilse Google Play'e gider
  var openUrl = isAndroid
    ? 'intent://' + path + '#Intent;scheme=nedirbilelim;package=' + PACKAGE + ';S.browser_fallback_url=' + encodeURIComponent(PLAY_URL) + ';end'
    : 'nedirbilelim://' + path;
  document.getElementById('openApp').href = openUrl;
})();
</script>
</body>
</html>
