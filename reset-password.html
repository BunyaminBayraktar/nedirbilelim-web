<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nedir Bilelim — Şifre Sıfırlama</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap');
  *{box-sizing:border-box;}
  body{margin:0; background:#f7f7fb; color:#1e1b2e; font-family:'Nunito Sans',sans-serif; padding-inline:16px;}
  .wrap{max-width:480px; margin:0 auto; padding-block:48px 80px;}
  .hero{background:linear-gradient(135deg,#16213e,#7c3aed); border-radius:24px; padding:36px 28px; color:#fff; margin-bottom:28px; text-align:center;}
  .hero h1{font-family:'Fredoka',sans-serif; font-weight:700; font-size:clamp(22px,6vw,30px); margin:0 0 8px 0;}
  .hero p{margin:0; font-size:14px; opacity:0.92; line-height:1.6;}
  .card{background:#fff; border:1px solid #e7e5f3; border-radius:16px; padding:24px 22px;}
  label{display:block; font-size:14px; font-weight:700; margin-bottom:6px; color:#1e1b2e;}
  input[type=password]{width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid #e0dcf0; font-size:15px; margin-bottom:16px; font-family:inherit;}
  input[type=password]:focus{outline:none; border-color:#7c3aed;}
  button{width:100%; padding:13px; border:none; border-radius:999px; background:#7c3aed; color:#fff; font-family:'Fredoka',sans-serif; font-weight:600; font-size:16px; cursor:pointer;}
  button:disabled{opacity:0.6; cursor:not-allowed;}
  button:hover:not(:disabled){background:#6d28d9;}
  .msg{font-size:14px; line-height:1.6; margin-top:14px; padding:12px 14px; border-radius:10px;}
  .msg.error{background:#fee2e2; color:#b91c1c;}
  .msg.success{background:#dcfce7; color:#15803d;}
  .hidden{display:none;}
  .email-badge{font-size:14px; color:#4b4763; margin-bottom:18px; text-align:center;}
  .center-text{text-align:center; color:#716d8a;}
  footer{margin-top:32px; text-align:center; color:#716d8a; font-size:13px;}
  a{color:#7c3aed;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>Şifre Sıfırlama</h1>
    <p>Nedir Bilelim hesabınız için yeni bir şifre belirleyin.</p>
  </div>

  <div class="card">
    <div id="loadingState">
      <p class="center-text">Bağlantı doğrulanıyor…</p>
    </div>

    <div id="formState" class="hidden">
      <p class="email-badge" id="emailBadge"></p>
      <form id="resetForm">
        <label for="password">Yeni Şifre</label>
        <input type="password" id="password" minlength="6" required autocomplete="new-password" placeholder="En az 6 karakter">
        <label for="password2">Yeni Şifre (Tekrar)</label>
        <input type="password" id="password2" minlength="6" required autocomplete="new-password" placeholder="Şifrenizi tekrar girin">
        <button type="submit" id="submitBtn">Şifreyi Güncelle</button>
      </form>
      <div id="formMsg"></div>
    </div>

    <div id="errorState" class="hidden">
      <div class="msg error" id="errorMsg"></div>
    </div>

    <div id="successState" class="hidden">
      <div class="msg success">Şifreniz başarıyla güncellendi. Artık Nedir Bilelim uygulamasına yeni şifrenizle giriş yapabilirsiniz.</div>
    </div>
  </div>

  <footer>© 2026 Nedir Bilelim</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script>
  var firebaseConfig = {
    apiKey: "AIzaSyAaygqvkDPhX0Xx5SP2vyyfUYF7JQ1rc-M",
    authDomain: "jdypassaparola.firebaseapp.com",
    projectId: "jdypassaparola",
    storageBucket: "jdypassaparola.appspot.com",
    messagingSenderId: "336994139357",
    appId: "1:336994139357:web:a0e34e073571d8c9beaf34"
  };
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();

  var params = new URLSearchParams(window.location.search);
  var mode = params.get('mode');
  var oobCode = params.get('oobCode');

  var loadingState = document.getElementById('loadingState');
  var formState = document.getElementById('formState');
  var errorState = document.getElementById('errorState');
  var successState = document.getElementById('successState');
  var errorMsg = document.getElementById('errorMsg');
  var emailBadge = document.getElementById('emailBadge');

  function showError(text) {
    loadingState.classList.add('hidden');
    formState.classList.add('hidden');
    successState.classList.add('hidden');
    errorState.classList.remove('hidden');
    errorMsg.textContent = text;
  }

  if (mode !== 'resetPassword' || !oobCode) {
    showError('Geçersiz veya eksik bağlantı. Lütfen uygulamadan yeni bir şifre sıfırlama e-postası isteyin.');
  } else {
    auth.verifyPasswordResetCode(oobCode).then(function (email) {
      loadingState.classList.add('hidden');
      formState.classList.remove('hidden');
      emailBadge.textContent = email;
    }).catch(function () {
      showError('Bu bağlantının süresi dolmuş veya daha önce kullanılmış. Lütfen uygulamadan yeni bir şifre sıfırlama e-postası isteyin.');
    });

    document.getElementById('resetForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var pw1 = document.getElementById('password').value;
      var pw2 = document.getElementById('password2').value;
      var formMsg = document.getElementById('formMsg');
      formMsg.innerHTML = '';

      if (pw1.length < 6) {
        formMsg.innerHTML = '<div class="msg error">Şifre en az 6 karakter olmalı.</div>';
        return;
      }
      if (pw1 !== pw2) {
        formMsg.innerHTML = '<div class="msg error">Şifreler eşleşmiyor.</div>';
        return;
      }

      var submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Güncelleniyor…';

      auth.confirmPasswordReset(oobCode, pw1).then(function () {
        formState.classList.add('hidden');
        successState.classList.remove('hidden');
      }).catch(function (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Şifreyi Güncelle';
        var msg = 'Bir hata oluştu, lütfen tekrar deneyin.';
        if (err.code === 'auth/weak-password') msg = 'Şifre çok zayıf, daha güçlü bir şifre seçin.';
        if (err.code === 'auth/expired-action-code') msg = 'Bağlantının süresi dolmuş, yeni bir e-posta isteyin.';
        if (err.code === 'auth/invalid-action-code') msg = 'Bu bağlantı geçersiz veya zaten kullanılmış.';
        formMsg.innerHTML = '<div class="msg error">' + msg + '</div>';
      });
    });
  }
</script>
</body>
</html>
